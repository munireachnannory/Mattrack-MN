<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MatTrack — Materials Lab Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#F5F5F7;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:#1D1D1F}
  #root{min-height:100vh}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#D2D2D7;border-radius:3px}
  select option{background:#fff}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fadeIn{animation:fadeIn .25s ease}
  .popIn{animation:popIn .2s cubic-bezier(.34,1.56,.64,1)}
  .spin{animation:spin .8s linear infinite}
  .mat-row:hover{background:#F5F5F7!important;cursor:pointer}
  .nav-btn:hover{color:#1D1D1F!important;background:#F2F2F7!important}
  .stat-card{transition:transform .2s,box-shadow .2s}.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.09)!important}
  .hover-red:hover{background:#FFF0F0!important;color:#FF3B30!important}
  .hover-bg:hover{background:#F5F5F7!important}
  input:focus,select:focus,textarea:focus{border-color:#0071E3!important;box-shadow:0 0 0 3px rgba(0,113,227,.12)!important;outline:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ═══════════════════════════════════════════════
// 🔑 YOUR SUPABASE CREDENTIALS
// ═══════════════════════════════════════════════
const SUPABASE_URL  = "https://kxlkzcskhgicybzawvwj.supabase.co";
const SUPABASE_ANON = "sb_publishable_-EdBe5Kd82rlvEg-vF6J6A_0T9cIJTw";
// ═══════════════════════════════════════════════

// ── Supabase REST + Auth helpers ──────────────
const api = {
  async req(path, method="GET", body, token) {
    const h = { "apikey":SUPABASE_ANON, "Content-Type":"application/json",
      "Prefer": method==="POST"?"return=representation":"return=minimal" };
    if (token) h["Authorization"] = `Bearer ${token}`;
    else h["Authorization"] = `Bearer ${SUPABASE_ANON}`;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method, headers:h, body:body?JSON.stringify(body):undefined });
    if (!res.ok) throw new Error(await res.text());
    const t = await res.text(); return t ? JSON.parse(t) : null;
  },
  get:   (p,tok)     => api.req(p,"GET",null,tok),
  post:  (p,b,tok)   => api.req(p,"POST",b,tok),
  patch: (p,b,tok)   => api.req(p,"PATCH",b,tok),
  del:   (p,tok)     => api.req(p,"DELETE",null,tok),
};

const auth = {
  // Sign up new user with email + password
  async signUp(email, password, fullName) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method:"POST",
      headers:{"apikey":SUPABASE_ANON,"Content-Type":"application/json"},
      body:JSON.stringify({ email, password, data:{ full_name: fullName } })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || "Sign up failed");
    return data;
  },
  // Sign in with email + password
  async signIn(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:"POST",
      headers:{"apikey":SUPABASE_ANON,"Content-Type":"application/json"},
      body:JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Invalid email or password");
    localStorage.setItem("mt_token", data.access_token);
    localStorage.setItem("mt_refresh", data.refresh_token||"");
    return data.access_token;
  },
  async getSession() {
    return localStorage.getItem("mt_token");
  },
  async getUser(token) {
    if (!token) return null;
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        headers:{ "apikey":SUPABASE_ANON, "Authorization":`Bearer ${token}` }
      });
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
  },
  signOut() {
    localStorage.removeItem("mt_token");
    localStorage.removeItem("mt_refresh");
    window.location.reload();
  }
};

// ── Constants ─────────────────────────────────
const BUILT_IN_TESTS = [
  {id:"tensile",   label:"Tensile Test",           category:"Mechanical",         color:"#FF6B35"},
  {id:"hardness",  label:"Hardness (Vickers)",      category:"Mechanical",         color:"#FF6B35"},
  {id:"xrd",       label:"XRD",                     category:"Structural",         color:"#0071E3"},
  {id:"sem",       label:"SEM Imaging",             category:"Structural",         color:"#0071E3"},
  {id:"dsc",       label:"DSC",                     category:"Thermal",            color:"#9B5DE5"},
  {id:"tga",       label:"TGA",                     category:"Thermal",            color:"#9B5DE5"},
  {id:"electrical",label:"Electrical Conductivity", category:"Electrical/Optical", color:"#05C091"},
  {id:"optical",   label:"UV-Vis Spectroscopy",     category:"Electrical/Optical", color:"#05C091"},
  {id:"density",   label:"Density / Porosity",      category:"Material Properties",color:"#F5A623"},
  {id:"eds",       label:"EDS / Composition",       category:"Material Properties",color:"#F5A623"},
];
const STATUS_OPTS   = ["Synthesized","In Testing","Completed","Needs Retest","Archived"];
const STATUS_COLORS = {Synthesized:"#0071E3","In Testing":"#FF6B35",Completed:"#34C759","Needs Retest":"#FF3B30",Archived:"#8E8E93"};
const OUTCOME_COLORS= {"Pass":"#34C759","Fail / Anomaly":"#FF3B30","Inconclusive":"#FF9500","In Progress":"#0071E3"};
const TEAM_STATIC   = ["Munireach Nannory","Vivek Chawla","Stephen Puplampu"];

// ── Helpers ───────────────────────────────────
const uid      = () => Math.random().toString(36).slice(2,8).toUpperCase();
const today    = () => new Date().toISOString().split("T")[0];
const getMeta  = id => BUILT_IN_TESTS.find(t=>t.id===id)||{label:id||"Unknown",color:"#8E8E93",category:"Custom"};
const timeAgo  = d => { const days=Math.floor((Date.now()-new Date(d))/86400000); if(days===0)return"Today"; if(days===1)return"Yesterday"; if(days<7)return days+"d ago"; if(days<30)return Math.floor(days/7)+"w ago"; return Math.floor(days/30)+"mo ago"; };
const initials = n => (n||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const avatarBg = n => ({...{"Munireach Nannory":"#0071E3","Vivek Chawla":"#9B5DE5","Stephen Puplampu":"#05C091"}}[n]||"#"+((n||"").split("").reduce((a,c)=>a+c.charCodeAt(0),5381)%0xCCCCCC).toString(16).padStart(6,"0"));
const fileIcon = n => ({xlsx:"📊",xls:"📊",csv:"📊",pptx:"📑",ppt:"📑",docx:"📄",doc:"📄",pdf:"📄",png:"🖼",jpg:"🖼",jpeg:"🖼",gif:"🖼",tiff:"🖼",zip:"📦",py:"💻",txt:"📝"}[(n||"").split(".").pop().toLowerCase()]||"📎");
const fileColor= n => { const e=(n||"").split(".").pop().toLowerCase(); if(["xlsx","xls","csv"].includes(e))return"#34C759"; if(["pptx","ppt"].includes(e))return"#FF6B35"; if(["docx","doc","pdf"].includes(e))return"#0071E3"; if(["png","jpg","jpeg","gif","tiff"].includes(e))return"#9B5DE5"; return"#8E8E93"; };
const fmtBytes = b => b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(1)+" MB";
const f2b64   = f => new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=err;r.readAsDataURL(f);});
function fuzzy(str,q){if(!q)return 1;str=str.toLowerCase();q=q.toLowerCase();if(str.includes(q))return 1;const tri=s=>{const set=new Set();const p="  "+s+"  ";for(let i=0;i<p.length-2;i++)set.add(p.slice(i,i+3));return set;};const ss=tri(str),qs=tri(q);let ov=0;qs.forEach(t=>{if(ss.has(t))ov++;});return(2*ov)/(ss.size+qs.size);}
function searchScore(mat,q){if(!q)return{match:true,score:1};const fields=[mat.name,mat.id,mat.composition||"",mat.form||"",mat.created_by||"",...(mat.tags||[]),mat.notes||"",...(mat.tests||[]).map(t=>(t.result||"")+" "+(t.tester||"")+" "+(getMeta(t.type).label||""))];const best=Math.max(...fields.map(f=>fuzzy(f,q)));return{match:best>0.15,score:best};}

// ── Primitive UI ──────────────────────────────
const S = { inp:{width:"100%",border:"1px solid #D2D2D7",borderRadius:10,padding:"10px 14px",fontSize:15,fontFamily:"inherit",color:"#1D1D1F",background:"#fff",outline:"none",boxSizing:"border-box"} };
function Pill({children,color="#999"}){return <span style={{display:"inline-flex",alignItems:"center",padding:"2px 10px",borderRadius:20,background:color+"14",color,fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>{children}</span>;}
function Avatar({name,size=28}){return <div style={{width:size,height:size,borderRadius:"50%",background:avatarBg(name),display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:size*.38,fontWeight:700,flexShrink:0}}>{initials(name)}</div>;}
function StatusPill({status}){return <Pill color={STATUS_COLORS[status]||"#999"}>{status}</Pill>;}
function Field({label,required,hint,children}){return(<div style={{marginBottom:18}}><label style={{display:"block",fontSize:13,fontWeight:600,color:"#6E6E73",marginBottom:6}}>{label}{required&&<span style={{color:"#FF3B30"}}> *</span>}</label>{children}{hint&&<div style={{fontSize:12,color:"#8E8E93",marginTop:4}}>{hint}</div>}</div>);}
function Spinner({size=40}){return <div className="spin" style={{width:size,height:size,border:`3px solid #F2F2F7`,borderTop:`3px solid #0071E3`,borderRadius:"50%"}} />;}

// ── Confirm Dialog ────────────────────────────
function ConfirmDialog({title,message,confirmLabel="Delete",confirmColor="#FF3B30",onConfirm,onCancel}){
  return(
    <div onClick={e=>{if(e.target===e.currentTarget)onCancel()}} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",backdropFilter:"blur(8px)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="popIn" style={{background:"#fff",borderRadius:18,width:"100%",maxWidth:420,padding:32,boxShadow:"0 32px 80px rgba(0,0,0,0.18)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:16}}>🗑️</div>
        <div style={{fontSize:19,fontWeight:700,color:"#1D1D1F",marginBottom:10}}>{title}</div>
        <div style={{fontSize:15,color:"#6E6E73",lineHeight:1.6,marginBottom:28}}>{message}</div>
        <div style={{display:"flex",gap:12,justifyContent:"center"}}>
          <button onClick={onCancel} style={{border:"1px solid #D2D2D7",background:"#fff",color:"#1D1D1F",padding:"10px 24px",borderRadius:10,cursor:"pointer",fontSize:15,fontWeight:500}}>Cancel</button>
          <button onClick={onConfirm} style={{background:confirmColor,border:"none",color:"#fff",padding:"10px 28px",borderRadius:10,cursor:"pointer",fontSize:15,fontWeight:600}}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

// ── Modal ─────────────────────────────────────
function Modal({title,onClose,wide,children}){
  useEffect(()=>{const h=e=>{if(e.key==="Escape")onClose();};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[onClose]);
  return(
    <div onClick={e=>{if(e.target===e.currentTarget)onClose()}} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.25)",backdropFilter:"blur(8px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="popIn" style={{background:"#fff",borderRadius:18,width:"100%",maxWidth:wide?640:520,maxHeight:"90vh",overflow:"auto",boxShadow:"0 32px 80px rgba(0,0,0,0.18)"}}>
        <div style={{padding:"22px 28px 18px",borderBottom:"1px solid #F2F2F7",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:"#fff",zIndex:10}}>
          <span style={{fontSize:18,fontWeight:700,color:"#1D1D1F"}}>{title}</span>
          <button onClick={onClose} style={{background:"#F2F2F7",border:"none",borderRadius:"50%",width:30,height:30,cursor:"pointer",fontSize:16,color:"#6E6E73"}}>×</button>
        </div>
        <div style={{padding:"22px 28px 28px"}}>{children}</div>
      </div>
    </div>
  );
}

// ── Add New Inline ────────────────────────────
function AddNew({placeholder,onAdd,color="#0071E3"}){
  const [open,setOpen]=useState(false);const [val,setVal]=useState("");const ref=useRef();
  useEffect(()=>{if(open&&ref.current)ref.current.focus();},[open]);
  const commit=()=>{const v=val.trim();if(v){onAdd(v);setVal("");setOpen(false);}};
  if(!open)return(<button onClick={()=>setOpen(true)} style={{display:"flex",alignItems:"center",gap:5,background:"none",border:"1px dashed #D2D2D7",borderRadius:8,padding:"5px 12px",cursor:"pointer",color,fontSize:13,fontWeight:600,marginTop:6,width:"100%"}}><span style={{fontSize:16}}>+</span> Add new…</button>);
  return(<div style={{display:"flex",gap:6,marginTop:6}}><input ref={ref} style={{...S.inp,flex:1,fontSize:14,padding:"7px 11px"}} placeholder={placeholder} value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setOpen(false);setVal("");}}} /><button onClick={commit} style={{background:color,border:"none",color:"#fff",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontWeight:600,fontSize:13}}>Add</button><button onClick={()=>{setOpen(false);setVal("");}} style={{background:"#F2F2F7",border:"none",color:"#6E6E73",borderRadius:8,padding:"7px 10px",cursor:"pointer",fontSize:14}}>✕</button></div>);
}

// ── File Upload Zone ──────────────────────────
function FileZone({files,onChange}){
  const [drag,setDrag]=useState(false);const [busy,setBusy]=useState(false);const ref=useRef();
  const process=async raw=>{setBusy(true);const out=await Promise.all(Array.from(raw).map(async f=>({id:uid(),name:f.name,size:f.size,type:f.type,data:await f2b64(f),uploadedAt:today()})));onChange([...files,...out]);setBusy(false);};
  return(<div><div onClick={()=>ref.current.click()} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);process(e.dataTransfer.files)}} style={{border:"2px dashed "+(drag?"#0071E3":"#D2D2D7"),borderRadius:12,padding:20,textAlign:"center",cursor:"pointer",background:drag?"#EAF3FF":"#F9F9FB",transition:"all .15s"}}><input ref={ref} type="file" multiple style={{display:"none"}} onChange={e=>process(e.target.files)} /><div style={{fontSize:28,marginBottom:8}}>{busy?"⏳":"📁"}</div><div style={{fontSize:14,fontWeight:600,color:"#1D1D1F",marginBottom:4}}>{busy?"Uploading…":"Drop files here or click to browse"}</div><div style={{fontSize:12,color:"#8E8E93"}}>Excel, PowerPoint, Images, PDF — any file type</div></div>{files.length>0&&(<div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>{files.map(f=>(<div key={f.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"#F9F9FB",borderRadius:8,border:"1px solid #F2F2F7"}}><span style={{fontSize:20}}>{fileIcon(f.name)}</span><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div><div style={{fontSize:11,color:"#8E8E93"}}>{fmtBytes(f.size)}</div></div><button onClick={()=>onChange(files.filter(x=>x.id!==f.id))} style={{background:"none",border:"none",color:"#FF3B30",cursor:"pointer",fontSize:18}}>×</button></div>))}</div>)}</div>);
}

function FileList({files}){
  if(!files||files.length===0)return null;
  const dl=f=>{const a=document.createElement("a");a.href=f.data;a.download=f.name;a.click();};
  return(<div style={{marginTop:12,display:"flex",flexDirection:"column",gap:6}}><div style={{fontSize:12,fontWeight:600,color:"#8E8E93",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4}}>Attached Files ({files.length})</div>{files.map(f=>{const isImg=f.type&&f.type.startsWith("image/");const c=fileColor(f.name);return(<div key={f.id} style={{background:"#F9F9FB",border:"1px solid #F2F2F7",borderRadius:10,overflow:"hidden"}}>{isImg&&<img src={f.data} alt={f.name} style={{width:"100%",maxHeight:180,objectFit:"cover",display:"block"}} />}<div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px"}}><span style={{fontSize:20}}>{fileIcon(f.name)}</span><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div><div style={{fontSize:11,color:"#8E8E93"}}>{fmtBytes(f.size)} · {f.uploadedAt}</div></div><button onClick={()=>dl(f)} style={{background:c+"14",border:"1px solid "+c+"30",color:c,padding:"5px 12px",borderRadius:7,cursor:"pointer",fontSize:12,fontWeight:600}}>⬇ Download</button></div></div>);})}</div>);
}

// ══════════════════════════════════════════════
// ── LOGIN PAGE ────────────────────────────────
// ══════════════════════════════════════════════
function LoginPage({onSignIn, onRegister, error}){
  const [tab, setTab]         = useState("signin"); // "signin" | "register"
  const [name, setName]       = useState("");
  const [email, setEmail]     = useState("");
  const [password, setPass]   = useState("");
  const [showPass, setShowP]  = useState(false);
  const [busy, setBusy]       = useState(false);
  const [localErr, setErr]    = useState("");
  const [registered, setReg]  = useState(false);

  const reset = () => { setName(""); setEmail(""); setPass(""); setErr(""); setReg(false); };

  const submit = async () => {
    setErr("");
    if (tab === "signin") {
      if (!email.trim() || !password) { setErr("Please enter your email and password."); return; }
      setBusy(true);
      try { await onSignIn(email.trim(), password); }
      catch(e) { setErr(e.message); }
      setBusy(false);
    } else {
      if (!name.trim())     { setErr("Please enter your full name."); return; }
      if (!email.trim())    { setErr("Please enter your email address."); return; }
      if (!email.includes("@")) { setErr("Please enter a valid email."); return; }
      if (password.length < 6)  { setErr("Password must be at least 6 characters."); return; }
      setBusy(true);
      try {
        await onRegister(email.trim(), password, name.trim());
        setReg(true);
      } catch(e) { setErr(e.message); }
      setBusy(false);
    }
  };

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#EAF3FF 0%,#F5F0FF 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="fadeIn" style={{background:"#fff",borderRadius:24,padding:"44px 40px",width:"100%",maxWidth:460,boxShadow:"0 24px 80px rgba(0,0,0,0.10)"}}>

        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{width:60,height:60,background:"#0071E3",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:28,fontWeight:800,margin:"0 auto 16px"}}>M</div>
          <h1 style={{fontSize:26,fontWeight:700,color:"#1D1D1F",letterSpacing:"-0.03em",marginBottom:4}}>MatTrack</h1>
          <p style={{fontSize:14,color:"#8E8E93"}}>Materials Lab Tracker — Restricted Access</p>
        </div>

        {/* Tabs */}
        <div style={{display:"flex",background:"#F2F2F7",borderRadius:12,padding:4,marginBottom:28}}>
          {[["signin","Sign In"],["register","Register"]].map(([id,label])=>(
            <button key={id} onClick={()=>{setTab(id);reset();}} style={{flex:1,padding:"9px 0",borderRadius:9,border:"none",cursor:"pointer",fontSize:14,fontWeight:600,background:tab===id?"#fff":"transparent",color:tab===id?"#1D1D1F":"#6E6E73",boxShadow:tab===id?"0 1px 4px rgba(0,0,0,0.1)":"none",transition:"all .15s"}}>{label}</button>
          ))}
        </div>

        {registered ? (
          // Success state after registration
          <div style={{background:"#F0FFF4",border:"1px solid #34C75940",borderRadius:16,padding:"28px 24px",textAlign:"center"}}>
            <div style={{fontSize:44,marginBottom:12}}>✅</div>
            <div style={{fontSize:18,fontWeight:700,color:"#1D1D1F",marginBottom:10}}>Registration submitted!</div>
            <div style={{fontSize:14,color:"#6E6E73",lineHeight:1.8}}>
              Your account has been created.<br/>
              <strong>Munireach (admin)</strong> will approve your access.<br/>
              Once approved, come back here and <strong>Sign In</strong>.
            </div>
            <button onClick={()=>{setTab("signin");reset();}} style={{marginTop:20,background:"#0071E3",border:"none",color:"#fff",padding:"10px 28px",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:600}}>Go to Sign In →</button>
          </div>
        ) : (
          <>
            {/* Name field — register only */}
            {tab==="register" && (
              <div style={{marginBottom:16}}>
                <label style={{display:"block",fontSize:13,fontWeight:600,color:"#6E6E73",marginBottom:6}}>Full Name <span style={{color:"#FF3B30"}}>*</span></label>
                <input style={S.inp} placeholder="e.g. Munireach Nannory" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} />
              </div>
            )}

            {/* Email */}
            <div style={{marginBottom:16}}>
              <label style={{display:"block",fontSize:13,fontWeight:600,color:"#6E6E73",marginBottom:6}}>Email Address <span style={{color:"#FF3B30"}}>*</span></label>
              <input style={S.inp} type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} />
            </div>

            {/* Password */}
            <div style={{marginBottom:24}}>
              <label style={{display:"block",fontSize:13,fontWeight:600,color:"#6E6E73",marginBottom:6}}>Password <span style={{color:"#FF3B30"}}>*</span>{tab==="register"&&<span style={{color:"#8E8E93",fontWeight:400}}> (min. 6 characters)</span>}</label>
              <div style={{position:"relative"}}>
                <input style={{...S.inp,paddingRight:48}} type={showPass?"text":"password"} placeholder="••••••••" value={password} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} />
                <button onClick={()=>setShowP(p=>!p)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:18,color:"#8E8E93"}}>{showPass?"🙈":"👁"}</button>
              </div>
            </div>

            {/* Error */}
            {(localErr||error)&&<div style={{marginBottom:16,background:"#FFF0F0",border:"1px solid #FF3B3040",borderRadius:10,padding:"12px 14px",fontSize:14,color:"#FF3B30"}}>{localErr||error}</div>}

            {/* Submit */}
            <button onClick={submit} disabled={busy} style={{width:"100%",background:!busy?"#0071E3":"#D1D1D6",border:"none",color:"#fff",padding:"13px 20px",borderRadius:12,cursor:!busy?"pointer":"not-allowed",fontSize:15,fontWeight:600}}>
              {busy ? "Please wait…" : tab==="signin" ? "Sign In →" : "Create Account →"}
            </button>

            {tab==="register"&&<p style={{marginTop:16,fontSize:13,color:"#8E8E93",textAlign:"center",lineHeight:1.6}}>After registering, your account will be reviewed by the admin before you can access the lab database.</p>}
          </>
        )}
      </div>
    </div>
  );
}

// ── ADD MATERIAL MODAL ────────────────────────

const MATERIAL_TYPES = ["Alloy","Ceramic","Polymer","Composite","Semiconductor","Biomaterial","Coating","Other"];
const BASE_STATUS_OPTS = ["Synthesized","In Testing","Completed","Needs Retest","Archived"];

function AddMaterialModal({onClose, onAdd, allTesters, customStatuses, onAddCustomStatus, customMatTypes, onAddCustomMatType}){
  const [f,setF] = useState({name:"",composition:"",form:"",created_by:"",customCreator:"",status:"Synthesized",customStatus:"",matType:"",tags:"",notes:""});
  const [files,setFiles] = useState([]);
  const [busy,setBusy]   = useState(false);
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  const allStatuses  = [...BASE_STATUS_OPTS, ...customStatuses];
  const allMatTypes  = [...MATERIAL_TYPES,   ...customMatTypes];
  const finalCreator = f.created_by==="__custom__" ? f.customCreator.trim() : f.created_by;
  const finalStatus  = f.status==="__custom__"     ? f.customStatus.trim()  : f.status;
  const ok = f.name && finalCreator;

  const submit = async () => {
    if(!ok) return;
    setBusy(true);
    await onAdd({
      id: "MAT-"+uid(), ...f,
      created_by: finalCreator,
      status: finalStatus || "Synthesized",
      mat_type: f.matType,
      created_at: today(),
      tags: f.tags.split(",").map(t=>t.trim()).filter(Boolean),
      files
    });
    setBusy(false);
    onClose();
  };

  return(
    <Modal title="Register New Material" wide onClose={onClose}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>

        {/* Material Name */}
        <div style={{gridColumn:"1/-1"}}>
          <Field label="Material Name" required>
            <input style={S.inp} placeholder="e.g. Ti-6Al-4V Alloy" value={f.name} onChange={e=>set("name",e.target.value)} />
          </Field>
        </div>

        {/* Composition + Physical Form */}
        <Field label="Composition / Formula">
          <input style={S.inp} placeholder="e.g. Ti 90%, Al 6%, V 4%" value={f.composition} onChange={e=>set("composition",e.target.value)} />
        </Field>
        <Field label="Physical Form">
          <input style={S.inp} placeholder="e.g. Powder, Rod, Film" value={f.form} onChange={e=>set("form",e.target.value)} />
        </Field>

        {/* Material Type — NEW */}
        <div style={{gridColumn:"1/-1"}}>
          <Field label="Material Type" hint="Select a category or add a custom one">
            <select style={S.inp} value={f.matType} onChange={e=>set("matType",e.target.value)}>
              <option value="">— Select type —</option>
              {allMatTypes.map(t=><option key={t}>{t}</option>)}
            </select>
            <AddNew placeholder="e.g. Hydrogel, Metamaterial, MOF…" color="#05C091"
              onAdd={t=>{ onAddCustomMatType(t); set("matType",t); }} />
          </Field>
        </div>

        {/* Created By — with custom option */}
        <Field label="Created By" required hint="Select from list or type a custom name">
          <select style={S.inp} value={f.created_by} onChange={e=>set("created_by",e.target.value)}>
            <option value="">— Select —</option>
            {allTesters.map(m=><option key={m}>{m}</option>)}
            <option value="__custom__">✏️ Type a custom name…</option>
          </select>
          {f.created_by==="__custom__" && (
            <input style={{...S.inp,marginTop:8}} placeholder="Enter full name" value={f.customCreator}
              onChange={e=>set("customCreator",e.target.value)} autoFocus />
          )}
        </Field>

        {/* Status — with custom option */}
        <Field label="Status" hint="Select or add a custom status">
          <select style={S.inp} value={f.status} onChange={e=>set("status",e.target.value)}>
            {allStatuses.map(s=><option key={s}>{s}</option>)}
            <option value="__custom__">✏️ Type a custom status…</option>
          </select>
          {f.status==="__custom__" && (
            <input style={{...S.inp,marginTop:8}} placeholder="e.g. Under Review, On Hold…" value={f.customStatus}
              onChange={e=>set("customStatus",e.target.value)} autoFocus />
          )}
          <AddNew placeholder="e.g. Under Review, On Hold…" color="#FF9500"
            onAdd={s=>{ onAddCustomStatus(s); set("status",s); }} />
        </Field>

        {/* Tags */}
        <div style={{gridColumn:"1/-1"}}>
          <Field label="Tags (comma-separated)">
            <input style={S.inp} placeholder="e.g. aerospace, titanium, high-temp" value={f.tags} onChange={e=>set("tags",e.target.value)} />
          </Field>
        </div>

        {/* Notes */}
        <div style={{gridColumn:"1/-1"}}>
          <Field label="Notes">
            <textarea style={{...S.inp,resize:"vertical",minHeight:72}} placeholder="Synthesis conditions, batch info…" value={f.notes} onChange={e=>set("notes",e.target.value)} />
          </Field>
        </div>

        {/* Files */}
        <div style={{gridColumn:"1/-1"}}>
          <Field label="Attach Files" hint="Upload datasheets, images, reference documents">
            <FileZone files={files} onChange={setFiles} />
          </Field>
        </div>
      </div>

      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}>
        <button onClick={onClose} style={{border:"1px solid #D2D2D7",background:"#fff",color:"#1D1D1F",padding:"10px 22px",borderRadius:10,cursor:"pointer",fontSize:15}}>Cancel</button>
        <button onClick={submit} disabled={!ok||busy} style={{background:ok&&!busy?"#0071E3":"#D1D1D6",border:"none",color:"#fff",padding:"10px 26px",borderRadius:10,cursor:ok&&!busy?"pointer":"not-allowed",fontSize:15,fontWeight:600}}>
          {busy?"Saving…":"Register Material"}
        </button>
      </div>
    </Modal>
  );
}

function AddTestModal({material,onClose,onAdd,cTests,addCTest,allTesters,addCTester,cOutcomes,addCOutcome}){

  const allTypes=[...BUILT_IN_TESTS,...cTests.map(t=>({id:"c_"+t.id,label:t.label,category:"Custom",color:"#6E6E73"}))];
  const allCats=[...new Set(allTypes.map(t=>t.category))];
  const allOuts=[...Object.keys(OUTCOME_COLORS),...cOutcomes];

xWrap:"wrap"}}>{allOuts.map(s=>{const c=OUTCOME_COLORS[s]||"#6E6E73",sel=f.outcome===s;return(<button key={s} onClick={()=>set("outcome",s)} style={{padding:"8px 16px",borderRadius:10,border:"2px solid "+(sel?c:"#E5E5EA"),background:sel?c+"14":"#fff",color:sel?c:"#6E6E73",cursor:"pointer",fontWeight:600,fontSize:14,whiteSpace:"nowrap"}}>{s}</button>);})}</div><AddNew placeholder="e.g. Partial Success…" color="#FF9500" onAdd={o=>{addCOutcome(o);set("outcome",o);}} /></Field><Field label="Notes"><textarea style={{...S.inp,resize:"vertical",minHeight:60}} placeholder="Equipment settings, conditions…" value={f.notes} onChange={e=>set("notes",e.target.value)} /></Field><Field label="Attach Files" hint="Upload raw data, SEM images, XRD patterns, Excel sheets, etc."><FileZone files={files} onChange={setFiles} /></Field><div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}><button onClick={onClose} style={{border:"1px solid #D2D2D7",background:"#fff",color:"#1D1D1F",padding:"10px 22px",borderRadius:10,cursor:"pointer",fontSize:15}}>Cancel</button><button onClick={submit} disabled={!ok||busy} style={{background:ok&&!busy?"#0071E3":"#D1D1D6",border:"none",color:"#fff",padding:"10px 26px",borderRadius:10,cursor:ok&&!busy?"pointer":"not-allowed",fontSize:15,fontWeight:600}}>{busy?"Saving…":"Log Test"}</button></div></Modal>);
}

// ── EDIT MATERIAL MODAL ───────────────────────
// ══════════════════════════════════════════════
function EditMaterialModal({mat,onClose,onSave,allTesters,customStatuses,onAddCustomStatus,customMatTypes,onAddCustomMatType}){
  const allStatuses=[...BASE_STATUS_OPTS,...customStatuses];
  const allMatTypes=[...MATERIAL_TYPES,...customMatTypes];
  const [f,setF]=useState({
    name:mat.name||"",composition:mat.composition||"",form:mat.form||"",
    created_by:allTesters.includes(mat.created_by)?mat.created_by:"__custom__",
    customCreator:allTesters.includes(mat.created_by)?"":( mat.created_by||""),
    status:allStatuses.includes(mat.status)?mat.status:"__custom__",
    customStatus:allStatuses.includes(mat.status)?"": (mat.status||""),
    matType:mat.mat_type||"",tags:(mat.tags||[]).join(", "),notes:mat.notes||"",
  });
  const [busy,setBusy]=useState(false);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const finalCreator=f.created_by==="__custom__"?f.customCreator.trim():f.created_by;
  const finalStatus=f.status==="__custom__"?f.customStatus.trim():f.status;
  const ok=f.name&&finalCreator;
  const submit=async()=>{
    if(!ok)return;setBusy(true);
    await onSave(mat.id,{name:f.name,composition:f.composition,form:f.form,created_by:finalCreator,status:finalStatus||"Synthesized",mat_type:f.matType,tags:f.tags.split(",").map(t=>t.trim()).filter(Boolean),notes:f.notes});
    setBusy(false);onClose();
  };
  return(
    <Modal title="Edit Material" wide onClose={onClose}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <div style={{gridColumn:"1/-1"}}><Field label="Material Name" required><input style={S.inp} value={f.name} onChange={e=>set("name",e.target.value)} /></Field></div>
        <Field label="Composition / Formula"><input style={S.inp} value={f.composition} onChange={e=>set("composition",e.target.value)} /></Field>
        <Field label="Physical Form"><input style={S.inp} value={f.form} onChange={e=>set("form",e.target.value)} /></Field>
        <div style={{gridColumn:"1/-1"}}><Field label="Material Type"><select style={S.inp} value={f.matType} onChange={e=>set("matType",e.target.value)}><option value="">— Select type —</option>{allMatTypes.map(t=><option key={t}>{t}</option>)}</select><AddNew placeholder="e.g. Hydrogel, MOF…" color="#05C091" onAdd={t=>{onAddCustomMatType(t);set("matType",t);}}/></Field></div>
        <Field label="Created By" required>
          <select style={S.inp} value={f.created_by} onChange={e=>set("created_by",e.target.value)}>
            <option value="">— Select —</option>
            {[...new Set(allTesters)].map(m=><option key={m}>{m}</option>)}
            <option value="__custom__">✏️ Type a custom name…</option>
          </select>
          {f.created_by==="__custom__"&&<input style={{...S.inp,marginTop:8}} placeholder="Enter full name" value={f.customCreator} onChange={e=>set("customCreator",e.target.value)} />}
        </Field>
        <Field label="Status">
          <select style={S.inp} value={f.status} onChange={e=>set("status",e.target.value)}>
            {allStatuses.map(s=><option key={s}>{s}</option>)}
            <option value="__custom__">✏️ Type a custom status…</option>
          </select>
          {f.status==="__custom__"&&<input style={{...S.inp,marginTop:8}} placeholder="e.g. Under Review…" value={f.customStatus} onChange={e=>set("customStatus",e.target.value)} />}
          <AddNew placeholder="e.g. Under Review…" color="#FF9500" onAdd={s=>{onAddCustomStatus(s);set("status",s);}}/>
        </Field>
        <div style={{gridColumn:"1/-1"}}><Field label="Tags (comma-separated)"><input style={S.inp} value={f.tags} onChange={e=>set("tags",e.target.value)} /></Field></div>
        <div style={{gridColumn:"1/-1"}}><Field label="Notes"><textarea style={{...S.inp,resize:"vertical",minHeight:72}} value={f.notes} onChange={e=>set("notes",e.target.value)} /></Field></div>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}>
        <button onClick={onClose} style={{border:"1px solid #D2D2D7",background:"#fff",color:"#1D1D1F",padding:"10px 22px",borderRadius:10,cursor:"pointer",fontSize:15}}>Cancel</button>
        <button onClick={submit} disabled={!ok||busy} style={{background:ok&&!busy?"#0071E3":"#D1D1D6",border:"none",color:"#fff",padding:"10px 26px",borderRadius:10,cursor:ok&&!busy?"pointer":"not-allowed",fontSize:15,fontWeight:600}}>{busy?"Saving…":"Save Changes"}</button>
      </div>
    </Modal>
  );
}

// ══════════════════════════════════════════════
// ── MATERIAL DETAIL ───────────────────────────
// ══════════════════════════════════════════════
function DetailPage({mat,onBack,onAddTest,onStatusChange,onDelete,onEdit,cTests,addCTest,allTesters,addCTester,cOutcomes,addCOutcome,isAdmin,customStatuses,onAddCustomStatus,customMatTypes,onAddCustomMatType}){

  const passes=tests.filter(t=>(t.outcome||t.status)==="Pass").length;
  const fails=tests.filter(t=>["Fail","Fail / Anomaly"].includes(t.outcome||t.status)).length;
  const fileCount=(mat.files||[]).length+tests.reduce((a,t)=>a+(t.files||[]).length,0);

    <div className="fadeIn">
      {showEdit&&<EditMaterialModal mat={mat} onClose={()=>setShowEdit(false)} onSave={onEdit} allTesters={allTesters} customStatuses={customStatuses||[]} onAddCustomStatus={onAddCustomStatus} customMatTypes={customMatTypes||[]} onAddCustomMatType={onAddCustomMatType} />}
      {showTest&&<AddTestModal material={mat} onClose={()=>setShowTest(false)} onAdd={async t=>{await onAddTest(t);setShowTest(false);}} cTests={cTests} addCTest={addCTest} allTesters={allTesters} addCTester={addCTester} cOutcomes={cOutcomes} addCOutcome={addCOutcome} />}

        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,flexWrap:"wrap"}}>
            <span style={{fontSize:13,color:"#6E6E73",fontWeight:600}}>{mat.id}</span>
            <StatusPill status={mat.status} />
            {fileCount>0&&<Pill color="#9B5DE5">📎 {fileCount} file{fileCount!==1?"s":""}</Pill>}
          </div>
          <h2 style={{margin:0,fontSize:28,fontWeight:700,color:"#1D1D1F",letterSpacing:"-0.03em"}}>{mat.name}</h2>

        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setShowEdit(true)} style={{border:"1px solid #0071E340",background:"#EAF3FF",color:"#0071E3",padding:"10px 18px",borderRadius:12,cursor:"pointer",fontSize:14,fontWeight:600,whiteSpace:"nowrap"}}>✏️ Edit</button>

          <button onClick={()=>setShowTest(true)} style={{background:"#0071E3",border:"none",color:"#fff",padding:"10px 22px",borderRadius:12,cursor:"pointer",fontSize:15,fontWeight:600,whiteSpace:"nowrap"}}>+ Log Test</button>

      <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:24,alignItems:"start"}}>

            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {[...tests].reverse().map(t=>{const m=getMeta(t.type);const lbl=t.type_label||m.label;const oc=t.outcome||t.status||"Pass";const oc_c=OUTCOME_COLORS[oc]||"#6E6E73";return(
                <div key={t.id} style={{background:"#fff",border:"1px solid #F2F2F7",borderRadius:14,padding:"18px 20px",boxShadow:"0 1px 4px rgba(0,0,0,.04)",borderLeft:"4px solid "+m.color}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:32,height:32,background:m.color+"12",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:12,color:m.color,fontWeight:800}}>{lbl.slice(0,2).toUpperCase()}</span></div><div><div style={{fontWeight:700,fontSize:15,color:"#1D1D1F"}}>{lbl}</div><div style={{fontSize:12,color:"#6E6E73"}}>{m.category}</div></div></div>
                    <div style={{display:"flex",gap:8,alignItems:"center"}}>{(t.files||[]).length>0&&<Pill color="#9B5DE5">📎 {t.files.length}</Pill>}<Pill color={oc_c}>{oc}</Pill></div>
                  </div>
                  <p style={{margin:"0 0 10px",fontSize:14,color:"#3A3A3C",lineHeight:1.6}}>{t.result}</p>
                  {t.notes&&<p style={{margin:"0 0 10px",fontSize:13,color:"#8E8E93",fontStyle:"italic"}}>{t.notes}</p>}
                  <FileList files={t.files||[]} />
                  <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10}}><Avatar name={t.tester} size={22} /><span style={{fontSize:13,color:"#6E6E73"}}>{t.tester}</span><span style={{color:"#C7C7CC"}}>|</span><span style={{fontSize:13,color:"#6E6E73"}}>{t.date} · {timeAgo(t.date)}</span></div>
                </div>
              );})}
            </div>
          )}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={{background:"#F9F9FB",borderRadius:14,padding:18}}><div style={{fontSize:12,fontWeight:600,color:"#8E8E93",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:14}}>Summary</div>{[["Tests run",tests.length],["Passed",passes],["Failed",fails],["Files",fileCount],["Added by",(mat.created_by||"").split(" ")[0]],["Date",mat.created_at]].map(([k,v])=>(<div key={k} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid #EBEBF0",fontSize:14}}><span style={{color:"#6E6E73"}}>{k}</span><span style={{fontWeight:600,color:"#1D1D1F"}}>{v}</span></div>))}</div>
          <div style={{background:"#F9F9FB",borderRadius:14,padding:18}}><div style={{fontSize:12,fontWeight:600,color:"#8E8E93",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Update Status</div><select style={{...S.inp,fontSize:14}} value={mat.status} onChange={e=>onStatusChange(mat.id,e.target.value)}>{STATUS_OPTS.map(s=><option key={s}>{s}</option>)}</select></div>
          {mat.tags&&mat.tags.length>0&&(<div style={{background:"#F9F9FB",borderRadius:14,padding:18}}><div style={{fontSize:12,fontWeight:600,color:"#8E8E93",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Tags</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{mat.tags.map(t=><Pill key={t} color="#0071E3">#{t}</Pill>)}</div></div>)}
          {mat.notes&&(<div style={{background:"#F9F9FB",borderRadius:14,padding:18}}><div style={{fontSize:12,fontWeight:600,color:"#8E8E93",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>Lab Notes</div><p style={{margin:0,fontSize:14,color:"#3A3A3C",lineHeight:1.7}}>{mat.notes}</p></div>)}
        </div>
      </div>
    </div>
  );
}

// ── TEAM PAGE ─────────────────────────────────
// ══════════════════════════════════════════════
function TeamPage({materials, allTesters, cTesters, isAdmin, token, onAddContributor}){
  const [users,setUsers]         = useState([]);
  const [loadingUsers,setLoading]= useState(false);
  const [newContrib,setNewContrib]= useState("");
  const [addingContrib,setAdding]= useState(false);

  const loadUsers = async() => {
    if(!isAdmin) return;
    setLoading(true);
    try { const rows = await api.get("allowed_users?order=approved.asc,created_at.desc", token); setUsers(rows||[]); }
    catch(e){ console.error(e); }
    setLoading(false);
  };
  useEffect(()=>{ if(isAdmin) loadUsers(); },[isAdmin]);

  const approveUser = async(id) => { await api.patch("allowed_users?id=eq."+id,{approved:true},token); loadUsers(); };
  const removeUser  = async(id) => { await api.del("allowed_users?id=eq."+id,token); loadUsers(); };

  const submitContrib = () => {
    const n = newContrib.trim();
    if(!n) return;
    onAddContributor(n);
    setNewContrib("");
    setAdding(false);
  };

  return(
    <div className="fadeIn">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <div>
          <h1 style={{fontSize:32,fontWeight:700,letterSpacing:"-0.03em",marginBottom:4}}>Team</h1>
          <p style={{fontSize:15,color:"#6E6E73"}}>Contributions from each team member.</p>
        </div>
        {/* Add Contributor button */}
        {isAdmin && !addingContrib && (
          <button onClick={()=>setAdding(true)} style={{background:"#0071E3",border:"none",color:"#fff",padding:"9px 20px",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:600,whiteSpace:"nowrap"}}>+ Add Contributor</button>
        )}
      </div>

      {/* Add Contributor inline form */}
      {isAdmin && addingContrib && (
        <div style={{background:"#EAF3FF",border:"1px solid #0071E330",borderRadius:14,padding:"16px 20px",marginBottom:20,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:14,fontWeight:600,color:"#0071E3",whiteSpace:"nowrap"}}>New Contributor:</span>
          <input style={{...S.inp,flex:1,minWidth:200,fontSize:14}} placeholder="e.g. Dr. Sarah Kim" value={newContrib}
            onChange={e=>setNewContrib(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter")submitContrib();if(e.key==="Escape"){setAdding(false);setNewContrib("");}}}
            autoFocus />
          <button onClick={submitContrib} style={{background:"#0071E3",border:"none",color:"#fff",padding:"9px 20px",borderRadius:9,cursor:"pointer",fontWeight:600,fontSize:14}}>Add</button>
          <button onClick={()=>{setAdding(false);setNewContrib("");}} style={{background:"#F2F2F7",border:"none",color:"#6E6E73",padding:"9px 14px",borderRadius:9,cursor:"pointer",fontSize:14}}>Cancel</button>
        </div>
      )}

      {/* Member cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:16,marginBottom:36}}>
        {allTesters.map(name=>{
          const created = materials.filter(m=>m.created_by===name).length;
          const allT    = materials.flatMap(m=>m.tests||[]);
          const tested  = allT.filter(t=>t.tester===name).length;
          const passed  = allT.filter(t=>t.tester===name&&(t.outcome==="Pass"||t.status==="Pass")).length;
          const recent  = allT.filter(t=>t.tester===name).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3)
            .map(t=>({...t, matName:(materials.find(m=>(m.tests||[]).some(x=>x.id===t.id))||{}).name||""}));
          const isCustom = cTesters.includes(name);
          return(
            <div key={name} style={{background:"#fff",border:"1px solid #F2F2F7",borderRadius:16,padding:24,boxShadow:"0 2px 8px rgba(0,0,0,.04)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
                <div style={{display:"flex",alignItems:"center",gap:14}}>
                  <Avatar name={name} size={48} />
                  <div>
                    <div style={{fontSize:17,fontWeight:700,color:"#1D1D1F"}}>{name}</div>
                    <div style={{fontSize:13,color:"#8E8E93",marginTop:2}}>{isCustom?"Contributor":"Research Team"}</div>
                  </div>
                </div>
              </div>

              {/* Stats */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:recent.length>0?16:0}}>
                {[["Materials",created,"#0071E3"],["Tests",tested,"#34C759"],["Pass Rate",tested>0?Math.round(passed/tested*100)+"%":"—","#FF9500"]].map(([l,v,c])=>(
                  <div key={l} style={{background:"#F9F9FB",borderRadius:10,padding:10,textAlign:"center"}}>
                    <div style={{fontSize:20,fontWeight:700,color:c}}>{v}</div>
                    <div style={{fontSize:11,color:"#8E8E93",marginTop:3,fontWeight:500}}>{l}</div>
                  </div>
                ))}
              </div>

              {/* Recent tests */}
              {recent.length>0&&(
                <>
                  <div style={{fontSize:12,fontWeight:600,color:"#8E8E93",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>Recent Tests</div>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {recent.map(t=>{
                      const meta=getMeta(t.type); const lbl=t.type_label||meta.label; const oc=t.outcome||t.status||"Pass";
                      return(
                        <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"#F9F9FB",borderRadius:8}}>
                          <div style={{width:6,height:6,borderRadius:"50%",background:meta.color,flexShrink:0}} />
                          <div style={{flex:1,minWidth:0}}>
                            <span style={{fontSize:13,fontWeight:500,color:"#1D1D1F"}}>{lbl}</span>
                            {t.matName&&<span style={{fontSize:12,color:"#8E8E93"}}> · {t.matName}</span>}
                          </div>
                          <Pill color={OUTCOME_COLORS[oc]||"#6E6E73"}>{oc}</Pill>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </div>
          );
        })}
      </div>

      {/* Admin: Access Management */}
      {isAdmin&&(
        <div style={{background:"#fff",border:"1px solid #F2F2F7",borderRadius:16,padding:24,boxShadow:"0 2px 8px rgba(0,0,0,.04)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
            <div>
              <div style={{fontSize:18,fontWeight:700,color:"#1D1D1F"}}>🔐 Access Management</div>
              <div style={{fontSize:13,color:"#8E8E93",marginTop:4}}>Only visible to you (admin). Approve or remove users.</div>
            </div>
            <button onClick={loadUsers} style={{background:"#F2F2F7",border:"none",color:"#6E6E73",padding:"7px 14px",borderRadius:8,cursor:"pointer",fontSize:13}}>↺ Refresh</button>
          </div>
          {loadingUsers?(<div style={{display:"flex",justifyContent:"center",padding:32}}><Spinner size={32}/></div>):(
            users.length===0?(<div style={{textAlign:"center",padding:32,color:"#8E8E93",fontSize:14}}>No users have signed in yet.</div>):(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {users.map(u=>(
                  <div key={u.id} style={{display:"flex",alignItems:"center",gap:14,padding:"12px 16px",background:"#F9F9FB",borderRadius:12,border:"1px solid "+(u.approved?"#34C75920":"#FF950020")}}>
                    <Avatar name={u.full_name||u.email} size={36} />
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:600,color:"#1D1D1F"}}>{u.full_name||"(name not provided)"}</div>
                      <div style={{fontSize:12,color:"#8E8E93",marginTop:2}}>{u.email}</div>
                      <div style={{fontSize:11,color:u.approved?"#34C759":"#FF9500",marginTop:2,fontWeight:600}}>{u.approved?"✓ Approved · "+u.created_at?.slice(0,10):"⏳ Pending approval"}</div>
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      {!u.approved&&<button onClick={()=>approveUser(u.id)} style={{background:"#34C75914",border:"1px solid #34C75940",color:"#34C759",padding:"6px 14px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>✓ Approve</button>}
                      <button onClick={()=>removeUser(u.id)} className="hover-red" style={{background:"#FF3B3014",border:"1px solid #FF3B3040",color:"#FF3B30",padding:"6px 14px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,transition:"all .12s"}}>Remove</button>
                    </div>
                  </div>
                ))}
              </div>
            )
          )}
          <div style={{marginTop:16,background:"#EAF3FF",borderRadius:10,padding:"12px 16px",fontSize:13,color:"#0071E3"}}>
            💡 When someone registers, they appear here as "Pending". Click <strong>Approve</strong> to grant access or <strong>Remove</strong> to block them.
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════
// ── MAIN APP ──────────────────────────────────
// ══════════════════════════════════════════════
function App(){
  // Auth state
  const [token,setToken]     = useState(null);
  const [user,setUser]       = useState(null);
  const [approved,setApproved]=useState(false);
  const [isAdmin,setIsAdmin] = useState(false);
  const [authLoading,setAuthLoading]=useState(true);
  const [authError,setAuthError]=useState(null);

  // App state
  const [materials,setMaterials]=useState([]);
  const [loading,setLoading]   =useState(true);
  const [dbError,setDbError]   =useState(null);
  const [syncing,setSyncing]   =useState(false);
  const [view,setView]         =useState("library");
  const [selId,setSelId]       =useState(null);
  const [showAdd,setShowAdd]   =useState(false);
  const [search,setSearch]     =useState("");
  const [fStatus,setFStatus]   =useState("All");
  const [fMember,setFMember]   =useState("All");
  const [cTests,setCTests]       = useState([]);
  const [cTesters,setCTesters]   = useState([]);
  const [cOutcomes,setCOutcomes] = useState([]);
  const [cStatuses,setCStatuses] = useState([]);
  const [cMatTypes,setCMatTypes] = useState([]);

  const ADMIN_EMAIL = "nannorymunireach22@gmail.com";
  const allTesters  = [...new Set([...TEAM_STATIC,...cTesters])]; // deduplicated

  // ── Auth init ────────────────────────────────
  useEffect(()=>{
    (async()=>{
      const tok = await auth.getSession();
      if(!tok){ setAuthLoading(false); return; }
      setToken(tok);
      const u = await auth.getUser(tok);
      if(!u){ auth.signOut(); return; }
      setUser(u);

      // Admin always gets in — check first before any DB query
      const emailLower = (u.email||"").toLowerCase().trim();
      const adminLower = ADMIN_EMAIL.toLowerCase().trim();
      if(emailLower === adminLower){
        setIsAdmin(true);
        setApproved(true);
        setAuthLoading(false);
        return;
      }

      // Non-admin: check allowed_users table
      try{
        const rows = await api.get(`allowed_users?email=eq.${encodeURIComponent(u.email)}&select=approved`, tok);
        if(rows && rows.length > 0 && rows[0].approved === true){
          setApproved(true);
        } else {
          // Register as pending so admin can see them
          await api.post("allowed_users", {email:u.email, approved:false}, tok).catch(()=>{});
        }
      }catch(e){ console.error("approval check error:", e); }
      setAuthLoading(false);
    })();
  },[]);

  // ── Auth handlers ─────────────────────────────
  const handleSignIn = async(email, password) => {
    const tok = await auth.signIn(email, password);
    setToken(tok);
    const u = await auth.getUser(tok);
    if (!u) throw new Error("Could not load user.");
    setUser(u);
    // Admin bypass — no approval check needed
    const emailLower = (u.email||"").toLowerCase().trim();
    if (emailLower === "nannorymunireach22@gmail.com") {
      setIsAdmin(true);
      setApproved(true);
      setAuthLoading(false);
      return;
    }
    // Non-admin: check approval
    try {
      const rows = await api.get(`allowed_users?email=eq.${encodeURIComponent(u.email)}&select=approved`, tok);
      if (rows && rows.length > 0 && rows[0].approved === true) setApproved(true);
    } catch(e) { console.error(e); }
    setAuthLoading(false);
  };

  const handleRegister = async(email, password, fullName) => {
    await auth.signUp(email, password, fullName);
    // Register as pending in allowed_users
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/allowed_users`, {
        method:"POST",
        headers:{"apikey":SUPABASE_ANON,"Authorization":`Bearer ${SUPABASE_ANON}`,"Content-Type":"application/json","Prefer":"resolution=ignore-duplicates"},
        body:JSON.stringify({email, full_name: fullName, approved: false})
      });
    } catch(e){}
    // Don't auto-login — wait for admin approval
  };

  // ── Data loading ─────────────────────────────
  const load=async(quiet=false)=>{
    try{
      if(!quiet)setLoading(true);setDbError(null);
      const [mats,tests,lists]=await Promise.all([
        api.get("materials?order=created_at.desc",token),
        api.get("tests?order=date.asc",token),
        api.get("custom_lists",token),
      ]);
      setMaterials((mats||[]).map(m=>({...m,tests:(tests||[]).filter(t=>t.material_id===m.id)})));
      (lists||[]).forEach(r=>{
        if(r.key==="testTypes") setCTests(r.value||[]);
        if(r.key==="testers")   setCTesters(r.value||[]);
        if(r.key==="outcomes")  setCOutcomes(r.value||[]);
        if(r.key==="statuses")  setCStatuses(r.value||[]);
        if(r.key==="matTypes")  setCMatTypes(r.value||[]);
      });
    }catch(e){setDbError(e.message);}
    finally{setLoading(false);}
  };
  useEffect(()=>{ if(approved)load(); },[approved]);
  useEffect(()=>{ if(!approved)return; const t=setInterval(()=>load(true),15000);return()=>clearInterval(t); },[approved]);

  // ── Custom lists ─────────────────────────────
  const saveList     = async(key,value) => api.patch("custom_lists?key=eq."+key,{value},token);
  const addCTest     = async t => { const u=cTests.some(x=>x.id===t.id)?cTests:[...cTests,t];    setCTests(u);    await saveList("testTypes",u); };
  const addCTester   = async n => { const u=cTesters.includes(n)?cTesters:[...cTesters,n];        setCTesters(u);  await saveList("testers",u); };
  const addCOutcome  = async o => { const u=cOutcomes.includes(o)?cOutcomes:[...cOutcomes,o];     setCOutcomes(u); await saveList("outcomes",u); };
  const addCStatus   = async s => { const u=cStatuses.includes(s)?cStatuses:[...cStatuses,s];     setCStatuses(u); await saveList("statuses",u); };
  const addCMatType  = async t => { const u=cMatTypes.includes(t)?cMatTypes:[...cMatTypes,t];     setCMatTypes(u); await saveList("matTypes",u); };
  const addContributor = async n => { await addCTester(n); };

  // ── CRUD ─────────────────────────────────────
  const addMaterial=async mat=>{
    setSyncing(true);
    const {tests, customCreator, customStatus, matType, ...row} = mat;
    row.mat_type = matType || "";
    try { await api.post("materials",row,token); } catch(e) { console.error("Save error:",e); alert("Could not save material: "+e.message); }
    await load(true);
    setSyncing(false);
  };
  const addTest=async test=>{setSyncing(true);await api.post("tests",test,token);await load(true);setSyncing(false);};
  const updateStatus=async(id,status)=>{setSyncing(true);await api.patch("materials?id=eq."+id,{status},token);setMaterials(p=>p.map(m=>m.id===id?{...m,status}:m));setSyncing(false);};
  const editMaterial=async(id,updates)=>{
    setSyncing(true);
    try { await api.patch("materials?id=eq."+id, updates, token); } catch(e) { alert("Error saving: "+e.message); }
    await load(true);
    setSyncing(false);
  };
  const deleteMaterial=async(id)=>{
    setSyncing(true);
    await api.del("tests?material_id=eq."+id,token);
    await api.del("materials?id=eq."+id,token);
    await load(true);
    setSyncing(false);
  };

  // ── Derived ───────────────────────────────────
  const selected  = materials.find(m=>m.id===selId);
  const filtered  = materials.map(m=>({...m,...searchScore(m,search)})).filter(m=>m.match&&(fStatus==="All"||m.status===fStatus)&&(fMember==="All"||m.created_by===fMember||(m.tests||[]).some(t=>t.tester===fMember))).sort((a,b)=>b.score-a.score);
  const totalTests= materials.reduce((a,m)=>a+(m.tests||[]).length,0);
  const totalFiles= materials.reduce((a,m)=>a+(m.files||[]).length+(m.tests||[]).reduce((b,t)=>b+(t.files||[]).length,0),0);
  const needsRet  = materials.filter(m=>m.status==="Needs Retest").length;
  const activity  = materials.flatMap(m=>(m.tests||[]).map(t=>({...t,matName:m.name,matId:m.id}))).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);
  const NAV=[{id:"library",label:"Materials"},{id:"activity",label:"Activity"},{id:"team",label:"Team"}];

  // ── Auth loading ──────────────────────────────
  if(authLoading) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <Spinner /><div style={{fontSize:15,color:"#6E6E73"}}>Loading MatTrack…</div>
    </div>
  );

  // ── Not logged in ─────────────────────────────
  if(!user) return <LoginPage onSignIn={handleSignIn} onRegister={handleRegister} error={authError} />;

  // ── Logged in but not approved ────────────────
  if(!approved) return <PendingPage user={user} onSignOut={auth.signOut} />;

  // ── Main app ──────────────────────────────────
  return(
    <div style={{minHeight:"100vh",background:"#F5F5F7"}}>
      {/* Navbar */}
      <nav style={{background:"rgba(255,255,255,0.88)",backdropFilter:"saturate(180%) blur(20px)",borderBottom:"1px solid rgba(0,0,0,0.08)",position:"sticky",top:0,zIndex:200}}>
        <div style={{maxWidth:1160,margin:"0 auto",padding:"0 24px",display:"flex",alignItems:"center",height:52,gap:4}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginRight:28}}>
            <div style={{width:26,height:26,background:"#0071E3",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:14,fontWeight:800}}>M</div>
            <span style={{fontSize:17,fontWeight:700,letterSpacing:"-0.02em"}}>Mat<span style={{color:"#0071E3"}}>Track</span></span>
          </div>
          {NAV.map(n=>(<button key={n.id} className="nav-btn" onClick={()=>setView(n.id)} style={{background:view===n.id?"#F2F2F7":"none",border:"none",color:view===n.id?"#1D1D1F":"#6E6E73",padding:"5px 14px",borderRadius:8,cursor:"pointer",fontSize:14,fontWeight:500,transition:"all .15s"}}>{n.label}</button>))}
          <div style={{flex:1}} />
          <div style={{display:"flex",alignItems:"center",gap:6,marginRight:12,fontSize:12,color:syncing?"#FF9500":"#34C759"}}>
            {syncing?<div className="spin" style={{width:8,height:8,border:"2px solid #FF950040",borderTop:"2px solid #FF9500",borderRadius:"50%"}} />:<span style={{width:7,height:7,borderRadius:"50%",background:"#34C759",display:"inline-block",boxShadow:"0 0 0 3px #34C75920"}} />}
            <span>{syncing?"Saving…":"Live"}</span>
          </div>
          {/* User info + sign out */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginRight:14}}>
            <Avatar name={user.email} size={28} />
            <span style={{fontSize:13,color:"#6E6E73",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.email}</span>
            {isAdmin&&<Pill color="#FF9500">Admin</Pill>}
          </div>
          <button onClick={auth.signOut} style={{background:"#F2F2F7",border:"none",color:"#6E6E73",padding:"6px 14px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:500}}>Sign Out</button>
          <button onClick={()=>setShowAdd(true)} style={{background:"#0071E3",border:"none",color:"#fff",padding:"7px 18px",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:600,marginLeft:6}}>+ New Material</button>
        </div>
      </nav>

      {loading&&(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"60vh",gap:16}}><Spinner /><div style={{fontSize:15,color:"#6E6E73"}}>Loading shared database…</div></div>)}
      {!loading&&dbError&&(<div style={{maxWidth:500,margin:"60px auto",padding:"0 24px",textAlign:"center"}}><div style={{fontSize:40,marginBottom:12}}>⚠️</div><div style={{fontSize:18,fontWeight:700,marginBottom:8}}>Database error</div><div style={{fontSize:14,color:"#6E6E73",marginBottom:20}}>{dbError}</div><button onClick={()=>load()} style={{background:"#0071E3",border:"none",color:"#fff",padding:"10px 24px",borderRadius:10,cursor:"pointer",fontSize:15,fontWeight:600}}>↺ Try Again</button></div>)}

      {!loading&&!dbError&&(
        <main style={{maxWidth:1160,margin:"0 auto",padding:"36px 24px"}}>
          {/* DETAIL */}
          {view==="detail"&&selected&&(<DetailPage mat={selected} onBack={()=>setView("library")} onAddTest={addTest} onStatusChange={updateStatus} onDelete={deleteMaterial} onEdit={editMaterial} cTests={cTests} addCTest={addCTest} allTesters={allTesters} addCTester={addCTester} cOutcomes={cOutcomes} addCOutcome={addCOutcome} isAdmin={isAdmin} customStatuses={cStatuses} onAddCustomStatus={addCStatus} customMatTypes={cMatTypes} onAddCustomMatType={addCMatType} />)}

          {/* LIBRARY */}
          {view==="library"&&(
            <div className="fadeIn">
              <div style={{marginBottom:28}}><h1 style={{fontSize:32,fontWeight:700,letterSpacing:"-0.03em",marginBottom:4}}>Materials Library</h1><p style={{fontSize:15,color:"#6E6E73"}}>Shared live across the team. Search by name, composition, tag, or tester.</p></div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:28}}>
                {[{l:"Total Materials",v:materials.length,c:"#0071E3"},{l:"Tests Logged",v:totalTests,c:"#34C759"},{l:"Files Stored",v:totalFiles,c:"#9B5DE5"},{l:"Needs Retest",v:needsRet,c:"#FF9500"}].map(s=>(<div key={s.l} className="stat-card" style={{background:"#fff",borderRadius:14,padding:"18px 20px",border:"1px solid #F2F2F7",boxShadow:"0 2px 8px rgba(0,0,0,.04)"}}><div style={{fontSize:30,fontWeight:700,color:s.c}}>{s.v}</div><div style={{fontSize:13,color:"#6E6E73",marginTop:4,fontWeight:500}}>{s.l}</div></div>))}
              </div>
              <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
                {/* Search */}
                <div style={{flex:1,minWidth:220,position:"relative"}}>
                  <span style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",color:"#8E8E93",fontSize:16,pointerEvents:"none"}}>🔍</span>
                  <input style={{...S.inp,paddingLeft:40}} placeholder="Search — name, ID, composition, tag…" value={search} onChange={e=>setSearch(e.target.value)} />
                  {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"#E5E5EA",border:"none",borderRadius:"50%",width:20,height:20,cursor:"pointer",fontSize:12,color:"#6E6E73"}}>×</button>}
                </div>
                <select style={{...S.inp,width:"auto",minWidth:160}} value={fStatus} onChange={e=>setFStatus(e.target.value)}><option value="All">All Statuses</option>{STATUS_OPTS.map(s=><option key={s}>{s}</option>)}</select>
                <select style={{...S.inp,width:"auto",minWidth:190}} value={fMember} onChange={e=>setFMember(e.target.value)}><option value="All">All Members</option>{allTesters.map(m=><option key={m}>{m}</option>)}</select>
                <button onClick={()=>load(true)} style={{background:"#F2F2F7",border:"none",color:"#6E6E73",padding:"10px 16px",borderRadius:10,cursor:"pointer",fontSize:14}}>↺</button>
              </div>

              <div style={{background:"#fff",borderRadius:16,border:"1px solid #F2F2F7",boxShadow:"0 2px 8px rgba(0,0,0,.04)",overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"90px 1fr 140px 180px 60px 60px 100px",padding:"10px 20px",background:"#F9F9FB",borderBottom:"1px solid #F2F2F7",fontSize:12,fontWeight:600,color:"#8E8E93",textTransform:"uppercase",letterSpacing:"0.05em"}}>
                  <span>ID</span><span>Material</span><span>Status</span><span>Created By</span><span>Tests</span><span>Files</span><span>Last Test</span>
                </div>
                {filtered.length===0?(<div style={{textAlign:"center",padding:"64px 20px",color:"#8E8E93"}}><div style={{fontSize:40,marginBottom:12}}>🔬</div><div style={{fontSize:17,fontWeight:600,color:"#1D1D1F",marginBottom:6}}>{search?"No materials found":"No materials yet"}</div><div style={{fontSize:14}}>{search?"Try different search terms":"Click '+ New Material' to get started"}</div></div>):
                filtered.map((m,i)=>{
                  const last=(m.tests||[]).length>0?m.tests[m.tests.length-1]:null;
                  const anomaly=(m.tests||[]).some(t=>["Fail","Fail / Anomaly"].includes(t.outcome||t.status));
                  const fc=(m.files||[]).length+(m.tests||[]).reduce((a,t)=>a+(t.files||[]).length,0);
                  return(<div key={m.id} className="mat-row" onClick={()=>{setSelId(m.id);setView("detail");}} style={{display:"grid",gridTemplateColumns:"90px 1fr 140px 180px 60px 60px 100px",padding:"14px 20px",borderBottom:i<filtered.length-1?"1px solid #F9F9FB":"none",background:"#fff",transition:"background .12s",alignItems:"center"}}>
                    <span style={{fontSize:12,fontWeight:600,color:"#0071E3"}}>{m.id}</span>
                    <div><div style={{fontWeight:600,fontSize:15,color:"#1D1D1F",marginBottom:5}}>{m.name}</div><div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>{m.form&&<span style={{fontSize:12,color:"#8E8E93"}}>{m.form}</span>}{(m.tags||[]).slice(0,2).map(t=><Pill key={t} color="#0071E3">#{t}</Pill>)}{anomaly&&<Pill color="#FF3B30">⚠ anomaly</Pill>}</div></div>
                    <StatusPill status={m.status} />
                    <div style={{display:"flex",alignItems:"center",gap:8}}><Avatar name={m.created_by} size={24} /><span style={{fontSize:13,color:"#3A3A3C"}}>{(m.created_by||"").split(" ")[0]}</span></div>
                    <div style={{textAlign:"center"}}><span style={{fontSize:15,fontWeight:700,color:(m.tests||[]).length>0?"#1D1D1F":"#C7C7CC"}}>{(m.tests||[]).length}</span></div>
                    <div style={{textAlign:"center"}}><span style={{fontSize:14,color:fc>0?"#9B5DE5":"#C7C7CC",fontWeight:600}}>{fc>0?"📎"+fc:"—"}</span></div>
                    <span style={{fontSize:13,color:"#6E6E73"}}>{last?timeAgo(last.date):"—"}</span>
                  </div>);
                })}
              </div>
              {filtered.length>0&&<div style={{padding:"12px 4px",fontSize:13,color:"#8E8E93"}}>Showing {filtered.length} of {materials.length} materials</div>}
            </div>
          )}

          {/* ACTIVITY */}
          {view==="activity"&&(
            <div className="fadeIn">
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}><h1 style={{fontSize:32,fontWeight:700,letterSpacing:"-0.03em"}}>Recent Activity</h1><button onClick={()=>load(true)} style={{background:"#F2F2F7",border:"none",color:"#6E6E73",padding:"7px 16px",borderRadius:8,cursor:"pointer",fontSize:13}}>↺ Refresh</button></div>
              <p style={{fontSize:15,color:"#6E6E73",marginBottom:28}}>Latest test entries from the whole team. Auto-updates every 15 seconds.</p>
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                {activity.length===0&&<div style={{textAlign:"center",padding:64,color:"#8E8E93"}}>No tests logged yet.</div>}
                {activity.map(item=>{const m=getMeta(item.type);const lbl=item.type_label||m.label;const oc=item.outcome||item.status||"Pass";const oc_c=OUTCOME_COLORS[oc]||"#6E6E73";const fc=(item.files||[]).length;return(
                  <div key={item.id} style={{background:"#fff",border:"1px solid #F2F2F7",borderRadius:14,padding:"16px 20px",boxShadow:"0 1px 4px rgba(0,0,0,.04)",display:"flex",gap:14,alignItems:"flex-start"}}>
                    <div style={{width:40,height:40,background:m.color+"14",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:13,color:m.color,fontWeight:800}}>{lbl.slice(0,2).toUpperCase()}</span></div>
                    <div style={{flex:1}}><div style={{marginBottom:6,fontSize:15,lineHeight:1.5}}><strong>{item.tester}</strong><span style={{color:"#6E6E73"}}> logged </span><span style={{fontWeight:600,color:m.color}}>{lbl}</span><span style={{color:"#6E6E73"}}> on </span><span style={{fontWeight:600,color:"#0071E3",cursor:"pointer"}} onClick={()=>{setSelId(item.matId);setView("detail");}}>{item.matName}</span><span style={{marginLeft:8}}><Pill color={oc_c}>{oc}</Pill></span>{fc>0&&<span style={{marginLeft:6}}><Pill color="#9B5DE5">📎{fc}</Pill></span>}</div><div style={{fontSize:14,color:"#3A3A3C",lineHeight:1.5}}>{(item.result||"").slice(0,130)}{(item.result||"").length>130?"…":""}</div><div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}><Avatar name={item.tester} size={20} /><span style={{fontSize:13,color:"#6E6E73"}}>{item.date} · {timeAgo(item.date)}</span></div></div>
                  </div>
                );})}
              </div>
            </div>
          )}

          {/* TEAM */}
          {view==="team"&&<TeamPage materials={materials} allTesters={allTesters} cTesters={cTesters} isAdmin={isAdmin} token={token} onAddContributor={addContributor} />}
        </main>
      )}

      {showAdd&&<AddMaterialModal onClose={()=>setShowAdd(false)} onAdd={async m=>{await addMaterial(m);setShowAdd(false);}} allTesters={allTesters} customStatuses={cStatuses} onAddCustomStatus={addCStatus} customMatTypes={cMatTypes} onAddCustomMatType={addCMatType} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
